# What the pipeline of Knot does. Every key overrides a default of
# actions/plan/defaults.yml in davils-com/kotlin-workflow; a key that is not there stops the run.
version: 1
gradle:
  args: ["--stacktrace"]

check:
  tasks: [check]
  reproducible:
    clean-tasks:
      - ":knot-platform:clean"
      - ":knot-environment:clean"
      - ":knot-shutdown:clean"
      - ":knot-failure:clean"
      - ":knot-testing:clean"
    tasks:
      - ":knot-platform:jvmJar"
      - ":knot-environment:jvmJar"
      - ":knot-shutdown:jvmJar"
      - ":knot-failure:jvmJar"
      - ":knot-testing:jvmJar"
    artifacts:
      - "knot-platform/build/libs/*.jar"
      - "knot-environment/build/libs/*.jar"
      - "knot-shutdown/build/libs/*.jar"
      - "knot-failure/build/libs/*.jar"
      - "knot-testing/build/libs/*.jar"

policy:
  # The detection of the host and the process tests of the shutdown differ between operating systems, so develop,
  # main and a tag run on Windows too.
  push-develop:
    stages: [check, snapshot]
    os: [ubuntu-latest, windows-latest]
    overrides:
      check:
        reproducible: { enabled: true }
  push-main:
    os: [ubuntu-latest, windows-latest]
    overrides:
      check:
        reproducible: { enabled: true }
  tag:
    os: [ubuntu-latest, windows-latest]

security:
  gradle:
    tasks: ["kreateAssurance"]
  dependency-submission:
    enabled: false

publish:
  build-tasks: [assemble]
  tasks:
    - ":knot-platform:publishAllPublicationsToDavilsRepository"
    - ":knot-environment:publishAllPublicationsToDavilsRepository"
    - ":knot-shutdown:publishAllPublicationsToDavilsRepository"
    - ":knot-failure:publishAllPublicationsToDavilsRepository"
    - ":knot-testing:publishAllPublicationsToDavilsRepository"
    - ":knot-bom:publishAllPublicationsToDavilsRepository"

snapshot:
  # Knot's own build makes every build without a release tag a snapshot.
  kreate-snapshot: false

release:
  publications:
    discovery: explicit
    # In upload order: the publication of every target before the multiplatform publication that names them.
    list:
      - path: com/davils/knot-platform-jvm
        artifact: knot-platform-jvm
        task: ":knot-platform:publishJvmPublicationToDavilsRepository"
      - path: com/davils/knot-platform-wasm-js
        artifact: knot-platform-wasm-js
        task: ":knot-platform:publishWasmJsPublicationToDavilsRepository"
      - path: com/davils/knot-platform
        artifact: knot-platform
        task: ":knot-platform:publishKotlinMultiplatformPublicationToDavilsRepository"
      - path: com/davils/knot-environment-jvm
        artifact: knot-environment-jvm
        task: ":knot-environment:publishJvmPublicationToDavilsRepository"
      - path: com/davils/knot-environment-wasm-js
        artifact: knot-environment-wasm-js
        task: ":knot-environment:publishWasmJsPublicationToDavilsRepository"
      - path: com/davils/knot-environment
        artifact: knot-environment
        task: ":knot-environment:publishKotlinMultiplatformPublicationToDavilsRepository"
  attest:
    subjects:
      - "knot-platform/build/libs/*.jar"
      - "knot-platform/build/libs/*.klib"
      - "knot-environment/build/libs/*.jar"
      - "knot-environment/build/libs/*.klib"
  github-release:
    enabled: false

# How a pull request of Dependabot repairs itself, see CONTRIBUTING.md, "Changing a Dependency".
dependencies:
  lock:
    invocations:
      - ["kreateResolveAndLockAll", "--write-locks", "--no-configuration-cache"]
  verification:
    tasks: [check]
